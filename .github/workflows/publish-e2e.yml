name: Publish e2e package

# Publishes @pih/pihemr-e2e (e2e/) to npm, compiled: Playwright does not compile TypeScript under node_modules, so the package holds the JavaScript that
# `npm run build` in e2e/ writes to e2e/dist/ (see e2e/README.md, "Publishing").
#
# - Push to master that changes e2e/: a pre-release, <pihemr version>-pre.<run number>, under the npm tag "next".
# - A pihemr release ("Release new version" finished): the version of the tag it created (the newest X.Y.Z tag), under the npm tag "latest". It is a
#   workflow_run trigger because the tag is pushed with the default GITHUB_TOKEN, and GitHub starts no workflow for a push or a Release made with it.
# - By hand ("Run workflow"): a release of the tag you name, e.g. to publish a tag again after a failure. A version that is already on npm is skipped.
#
# npm trusted publishing (OIDC), as openmrs-esm-pihemr does: no token is stored. The package's trusted publisher on npmjs.com must name this repository
# (PIH/pihemr) and this workflow file (publish-e2e.yml).

on:
  push:
    branches: [master]
    paths:
      - 'e2e/**'
      - '.github/workflows/publish-e2e.yml'
  workflow_run:
    workflows: ['Release new version']
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish this tag (e.g. 3.7.0) as the release ("latest"). Leave empty to publish a pre-release of master ("next").'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository_owner == 'PIH' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: publish-e2e-${{ github.event_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the version and the npm tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag=""
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            tag=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            if [ -z "$tag" ]; then
              echo "::error::The release finished but there is no X.Y.Z tag"
              exit 1
            fi
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          fi

          if [ -n "$tag" ]; then
            git checkout --quiet "$tag"
            version="${tag#v}"
            npm_tag=latest
          else
            base=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")
            version="${base%-SNAPSHOT}-pre.${GITHUB_RUN_NUMBER}"
            npm_tag=next
          fi

          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]+)?$'; then
            echo "::error::Not a version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing @pih/pihemr-e2e@$version under the npm tag $npm_tag"

      - uses: actions/setup-node@v7
        with:
          # npm 11.5.1 or later is needed for trusted publishing
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install, typecheck and build
        working-directory: e2e
        env:
          PIHEMR_E2E_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Publish
        working-directory: e2e
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
        run: |
          set -euo pipefail
          name=@pih/pihemr-e2e
          version="$VERSION"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm: nothing to publish"
            exit 0
          fi
          npm publish ./dist --access public --tag "$NPM_TAG"
