name: Update OCL export

# Replaces the PIH dictionary export in content/configuration/backend_configuration/ocl/
# with a released version from OCL, and opens a pull request for review.
# Run it from the Actions tab → "Update OCL export" → "Run workflow".
#
# With "Release a new version first" ticked, it first releases a new version of the PIH source
# in OCL: it runs the release check on everything changed since the last release, and only
# releases if there are no errors. Releasing needs OCL_API_TOKEN to belong to a member of the PIH
# organization in OCL. The release job runs in the "ocl-release" GitHub environment, so repo admins
# can require an approval before anything is released (Settings → Environments → ocl-release).
# A release includes everyone's unreleased edits in OCL, so check with the dictionary maintainers first.
#
# Before opening the PR, it runs the PIH OCL release check (ocl_release_check.py from the
# PIH/claude-plugins "ocl" plugin, downloaded from its main branch) on the concepts that changed
# since the export already in this repo. If the check finds errors (e.g. a concept name uuid
# that would break the OpenMRS import, UHM-9656), the run fails and no PR is opened.
# The same check is what the "ocl" Claude skill runs before a release; see that plugin's README.
#
# Could also run on a schedule (e.g. daily) to open a PR whenever a new version
# is released in OCL, by adding:
#   schedule:
#     - cron: "0 6 * * *"

on:
  workflow_dispatch:
    inputs:
      release_new_version:
        description: "Release a new version of the PIH source in OCL first (check with the dictionary maintainers)"
        type: boolean
        required: false
        default: false
      release_notes:
        description: "Release notes for the new version (required when releasing)"
        required: false
        default: ""
      version:
        description: "Version to use (e.g. 1.8.43). Blank = the latest release, or the next number when releasing."
        required: false
        default: ""
      skip_release_check:
        description: "Skip the release check (emergencies only; the PR will say it was skipped)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-ocl-export
  cancel-in-progress: false

jobs:
  release:
    if: github.repository_owner == 'PIH' && inputs.release_new_version
    runs-on: ubuntu-latest
    environment: ocl-release
    env:
      OCL_API: https://api.openconceptlab.org/orgs/PIH/sources/PIH
      CHECK_URL: https://raw.githubusercontent.com/PIH/claude-plugins/main/plugins/ocl/skills/ocl-search/scripts/ocl_release_check.py
    outputs:
      version: ${{ steps.release.outputs.version }}
      check_summary: ${{ steps.precheck.outputs.summary }}
    steps:
      - name: Work out the new version
        id: version
        env:
          OCL_API_TOKEN: ${{ secrets.OCL_API_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          auth="Authorization: Token ${OCL_API_TOKEN}"
          if [ -z "${RELEASE_NOTES// /}" ]; then
            echo "::error::Release notes are required when releasing a new version"
            exit 1
          fi
          latest=$(curl -sSf -H "$auth" "$OCL_API/latest/" | jq -r '.id')
          version="${REQUESTED_VERSION// /}"
          if [ -z "$version" ]; then
            # Next number after the latest release, e.g. 1.8.50 -> 1.8.51
            version="${latest%.*}.$(( ${latest##*.} + 1 ))"
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::'$version' is not a valid version number (expected something like 1.8.51)"
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "$auth" "$OCL_API/$version/")
          if [ "$code" != "404" ]; then
            echo "::error::Version $version already exists in OCL (HTTP $code). Leave the version blank to use the next number."
            exit 1
          fi
          echo "Latest release: $latest. New version: $version"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run PIH OCL release check on the unreleased changes
        id: precheck
        env:
          OCL_API_TOKEN: ${{ secrets.OCL_API_TOKEN }}
          SKIP: ${{ inputs.skip_release_check }}
        run: |
          set -uo pipefail
          summary="$RUNNER_TEMP/pre-release-check.md"
          if [ "$SKIP" = "true" ]; then
            printf '### PIH OCL pre-release check: ⚠️ SKIPPED\n\nThe release check was skipped when this workflow was run (skip_release_check).\n' > "$summary"
            status=0
          else
            curl -sSf -o "$RUNNER_TEMP/ocl_release_check.py" "$CHECK_URL" || { echo "::error::Couldn't download the release check from $CHECK_URL"; exit 1; }
            python3 -I "$RUNNER_TEMP/ocl_release_check.py" --unreleased --fail-on error --summary-md "$summary"
            status=$?
          fi
          [ -f "$summary" ] && cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "summary<<EOF_SUMMARY"
            cat "$summary" 2>/dev/null || echo "(no summary)"
            echo "EOF_SUMMARY"
          } >> "$GITHUB_OUTPUT"
          case "$status" in
            0) ;;
            1) echo "::error::The release check found errors in the unreleased changes (see the summary). Nothing was released. Fix them in OCL and run this again."; exit 1 ;;
            *) echo "::error::The release check couldn't run (exit $status). Nothing was released."; exit 1 ;;
          esac

      - name: Release the new version in OCL
        id: release
        env:
          OCL_API_TOKEN: ${{ secrets.OCL_API_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          body=$(jq -n --arg id "$VERSION" --arg d "$RELEASE_NOTES (released by ${GITHUB_ACTOR} via PIH/pihemr GitHub Actions)" \
                 '{id: $id, description: $d, released: true}')
          code=$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' -X POST \
                 -H "Authorization: Token ${OCL_API_TOKEN}" -H 'Content-Type: application/json' \
                 "$OCL_API/versions/" -d "$body")
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "::error::OCL refused to create version $VERSION (HTTP $code). Does OCL_API_TOKEN belong to a member of the PIH organization in OCL?"
            cat "$RUNNER_TEMP/release.json" || true
            exit 1
          fi
          released=$(curl -sSf -H "Authorization: Token ${OCL_API_TOKEN}" "$OCL_API/$VERSION/" | jq -r '.released')
          if [ "$released" != "true" ]; then
            echo "::error::Version $VERSION was created but isn't marked released in OCL"
            exit 1
          fi
          echo "::notice::Released PIH $VERSION in OCL"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  update-ocl-export:
    needs: release
    if: >-
      always() && github.repository_owner == 'PIH' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      OCL_API: https://api.openconceptlab.org/orgs/PIH/sources/PIH
      OCL_DIR: content/configuration/backend_configuration/ocl
    steps:
      - uses: actions/checkout@v4

      - name: Download export from OCL
        id: export
        env:
          OCL_TOKEN: ${{ secrets.OCL_API_TOKEN }}
          REQUESTED_VERSION: ${{ needs.release.outputs.version || inputs.version }}
        run: |
          set -euo pipefail
          auth="Authorization: Token ${OCL_TOKEN}"

          version="${REQUESTED_VERSION// /}"
          if [ -z "$version" ]; then
            version=$(curl -sSf -H "$auth" "$OCL_API/latest/" | jq -r '.id')
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::'$version' is not a valid version number (expected something like 1.8.43)"
            exit 1
          fi
          if ! version_json=$(curl -sSf -H "$auth" "$OCL_API/$version/"); then
            echo "::error::Couldn't find version $version of the PIH source in OCL"
            exit 1
          fi
          description=$(jq -r '.description // ""' <<< "$version_json")

          # The export endpoint redirects to a signed S3 URL once the export is built.
          # Until then it returns 204 (not started) or 208 (being built), so wait up to ~20 minutes.
          for _ in $(seq 1 40); do
            status=$(curl -sS -o /dev/null -D headers.txt -w '%{http_code}' -H "$auth" "$OCL_API/$version/export/")
            case "$status" in
              302|303) break ;;
              204|208) echo "Export for $version not ready yet (HTTP $status), waiting..."; sleep 30 ;;
              *) echo "::error::Unexpected response $status from OCL when requesting the export for $version"; exit 1 ;;
            esac
          done
          if [ "$status" != "302" ] && [ "$status" != "303" ]; then
            echo "::error::The export for $version still isn't ready in OCL after 20 minutes. Try again later."
            exit 1
          fi
          url=$(grep -i '^location:' headers.txt | awk '{print $2}' | tr -d '\r')
          rm headers.txt

          # Signed URL: download without the OCL token
          curl -sSf -o "$RUNNER_TEMP/export.zip" "$url"
          export_version=$(unzip -p "$RUNNER_TEMP/export.zip" export.json | jq -r '.id')
          if [ "$export_version" != "$version" ]; then
            echo "::error::Downloaded export is version '$export_version', expected '$version'"
            exit 1
          fi

          # e.g. PIH_PIH_v1.8.43.2026-10-29_212531.zip -> orgs_PIH_sources_PIH_1.8.43_2026-10-29_212531.zip
          timestamp=$(basename "${url%%\?*}" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{6}')
          filename="orgs_PIH_sources_PIH_${version}_${timestamp}.zip"

          current_version=""
          for f in "$OCL_DIR"/*.zip; do
            [ -e "$f" ] && current_version=$(unzip -p "$f" export.json | jq -r '.id')
          done
          if [ "$current_version" = "$version" ]; then
            echo "::notice::The repository already has version $version. Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Keep the current export as the baseline for the release check
          for f in "$OCL_DIR"/*.zip; do
            [ -e "$f" ] && cp "$f" "$RUNNER_TEMP/baseline.zip"
          done

          git rm -q "$OCL_DIR"/*.zip || true
          mkdir -p "$OCL_DIR"
          cp "$RUNNER_TEMP/export.zip" "$OCL_DIR/$filename"

          {
            echo "changed=true"
            echo "version=$version"
            echo "previous_version=${current_version:-none}"
            echo "filename=$filename"
            echo "description<<EOF"
            echo "$description"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run PIH OCL release check
        id: check
        if: steps.export.outputs.changed == 'true'
        env:
          OCL_API_TOKEN: ${{ secrets.OCL_API_TOKEN }}
          SKIP: ${{ inputs.skip_release_check }}
          CHECK_URL: https://raw.githubusercontent.com/PIH/claude-plugins/main/plugins/ocl/skills/ocl-search/scripts/ocl_release_check.py
        run: |
          set -uo pipefail
          summary="$RUNNER_TEMP/release-check.md"
          if [ "$SKIP" = "true" ]; then
            printf '### PIH OCL release check: ⚠️ SKIPPED\n\nThe release check was skipped when this workflow was run (skip_release_check). Check this export before merging.\n' > "$summary"
            status=0
          else
            curl -sSf -o "$RUNNER_TEMP/ocl_release_check.py" "$CHECK_URL" || { echo "::error::Couldn't download the release check from $CHECK_URL"; exit 1; }
            args=(--export "$RUNNER_TEMP/export.zip" --fail-on error --summary-md "$summary")
            if [ -f "$RUNNER_TEMP/baseline.zip" ]; then
              args+=(--baseline "$RUNNER_TEMP/baseline.zip")
            else
              echo "::warning::No export in the repository to compare with, so every concept is checked"
            fi
            python3 -I "$RUNNER_TEMP/ocl_release_check.py" "${args[@]}"
            status=$?
          fi
          [ -f "$summary" ] && cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "summary<<EOF_SUMMARY"
            cat "$summary" 2>/dev/null || echo "(no summary)"
            echo "EOF_SUMMARY"
          } >> "$GITHUB_OUTPUT"
          case "$status" in
            0) ;;
            1) echo "::error::The release check found errors in ${{ steps.export.outputs.version }} (see the summary). No PR was opened. Fix them in OCL, release a new version, and run this again."; exit 1 ;;
            *) echo "::error::The release check couldn't run (exit $status). No PR was opened."; exit 1 ;;
          esac

      - name: Open pull request
        if: steps.export.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT rather than GITHUB_TOKEN, so the "Verify PRs" workflow runs on the new PR
          token: ${{ secrets.GHA_WRITE_TOKEN }}
          branch: ocl-export-${{ steps.export.outputs.version }}
          delete-branch: true
          add-paths: ${{ env.OCL_DIR }}
          commit-message: "Update PIH OCL export to ${{ steps.export.outputs.version }}"
          title: "Update PIH OCL export to ${{ steps.export.outputs.version }}"
          body: |
            Replaces the PIH dictionary export (${{ steps.export.outputs.previous_version }} → **${{ steps.export.outputs.version }}**) with `${{ steps.export.outputs.filename }}`.

            OCL release notes for ${{ steps.export.outputs.version }}:
            > ${{ steps.export.outputs.description }}

            ${{ needs.release.outputs.check_summary }}

            ${{ steps.check.outputs.summary }}

            Requested by @${{ github.actor }} via the "Update OCL export" workflow.
